<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Extra2 - Login</title>
    <style type="text/css">@import url("extra2.css");</style>
</head>
<body>

<div class="container center">
        <div class="login-box">
            <div class="header">
                <h2>🔒 LOGIN</h2>
            </div>

            <div class="form">
                <label>E-mail address</label>
                <input type="email" placeholder="name@email.com">

                <label>Password</label>
                <input type="password" placeholder="******">

                <div class="remember">
                    <input type="checkbox" id="check">
                    <label for="check">Keep me signed in</label>
                </div>

                <button>Sign In</button>

                <p class="forgot">Forgot Password? <a href="#">Click here</a></p>
            </div>
        </div>
</div>

</body>
</html>
