<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Formulario de cadastro</title>
    <style type="text/css">@import url("atividade5.css");</style>
</head>
<body>

<div class="container">
    <div class="form-box">
        <div class="form-header">
            <h2>EVENT REGISTRATION FORM</h2>
        </div>

        <form>
            <div class="form-group">
                <label>Name</label>
                <div class="row">
                    <input type="text">
                    <input type="text">
                </div>
            </div>

            <div class="form-group">
                <label>Company</label>
                <input type="text">
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email">
            </div>

            <div class="form-group">
                <label>Phone</label>
                <div class="row">
                    <input type="text">
                    <input type="text">
                </div>
            </div>

            <div class="form-group">
                <label>Subject</label>
                <select>
                    <option>Choose option</option>
                    <option>Support</option>
                    <option>Sales</option>
                    <option>Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Are you an existing customer?</label>
                <div class="radio-group">
                    <label><input type="radio" name="customer" checked> Yes</label>
                    <label><input type="radio" name="customer"> No</label>
                </div>
            </div>

            <button type="submit">REGISTER</button>
        </form>
    </div>
</div>

</body>
</html>
