<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"> 

    <style type="text/css">
        div{
            color: #fff;
        }
    </style>

    <title>Trabalhando com containers</title>
</head>
<body>
    <div class="container bg-dark">Container (540px largura minima para 100%)</div>
    <div class="container-md bg-primary">Container-md (720px largura minima para 100%)</div>
    <div class="container-lg bg-danger">Container-lg (960px largura minima para 100%)</div>
    <div class="container-xl bg-success">Container-xl (1140px largura minima para 100%)</div>
    <div class="container-xxl bg-info">Container-xxl (1320px largura minima para 100%)</div>
    <div class="container-fluid bg-warning">Container-fluid (sempre 100%)</div>
</body>
</html>
