<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Extra3 - Login</title>
    <style type="text/css">@import url("extra3.css");</style>
</head>
<body>

<div class="container">
    <div class="login-box">
        
        <div class="left">
            <div class="input-box">
                <span class="icon">👤</span>
                <input type="text" placeholder="Username">
            </div>

            <div class="input-box">
                <span class="icon">🔒</span>
                <input type="password" placeholder="********">
            </div>

            <div class="options">
                <a href="#">Forgot Password?</a>
                <label>
                    <input type="checkbox">
                    Remember me
                </label>
            </div>
        </div>

        <div class="right">
            <button>LOGIN</button>
        </div>

    </div>
</div>

</body>
</html>
