<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"> 

    <style type="text/css">
        
    </style>

    <title>Trabalhando com Complementos</title>
</head>
<body>
    <div class="container">
        <div class="row">

            <!--
                Classes:
                    container -> Cria uma estrutura de box centralizda e reponsiva á partir da resolução 540px.
                    row -> Cria uma estrutura box similiar a uma linha de uma tabela.
                    col-md-4 -> Cria uma estrutura de box similar a uma coluna para a classe row e divide coluna que vai de 1a 12.
                    bg-info -> Determina a cor do background. (info, danger, sucess...).
                    text-start -> Alinha o texto a esquerda (horizontal).
                    text-center -> Alinha o texto ao centro (horizontal).
                    text-center -> Alinha o text a direta (horizontal).            
            -->
            <div class="col-md-4 bg-info text-start">Texto alinhado a esquerda</div>
            <div class="col-md-4 bg-warning text-center">Texto alinhado ao centro</div>
            <div class="col-md-4 bg-success text-end">Texto alinhado a direita</div>
        </div>
    </div>
</body>
</html>
